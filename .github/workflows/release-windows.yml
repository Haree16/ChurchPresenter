name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows-installer:
    name: Build Windows installer (NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is not tracked in this repo, so install without it.
      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build NSIS Installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: church-presenter-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach Installer To Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
