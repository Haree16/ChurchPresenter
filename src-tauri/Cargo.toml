[package]
name = "church-presenter"
version = "1.0.0"
description = "Offline-first church presentation desktop application"
authors = ["Church Presenter Team"]
edition = "2021"

[lib]
name = "church_presenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
midir = "0.10"
rosc = "0.10"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
base64 = "0.22"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
ureq = { version = "2.10", features = ["json", "tls"] }


[features]
default = ["custom-protocol", "devtools"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
